[package]
name = "axiom-db"
version = "0.1.0"
edition = "2021"

[dependencies]
axiom-ast = { path = "../axiom-ast" }
axiom-parser = { path = "../axiom-parser" }
axiom-smt = { path = "../axiom-smt" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
