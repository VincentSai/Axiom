[package]
name = "axiom-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "axiom"
path = "src/main.rs"

[dependencies]
axiom-hole-extractor = { path = "../axiom-hole-extractor" }
axiom-parser = { path = "../axiom-parser" }
axiom-transpiler = { path = "../axiom-transpiler" }
clap = { version = "4", features = ["derive"] }
serde_json = "1"
