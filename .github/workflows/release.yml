name: Release Axiom Binaries & Agent Skills

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: axiom.exe
            asset_name: axiom-${{ github.ref_name }}-x86_64-pc-windows-msvc.zip

          # Linux x64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: axiom
            asset_name: axiom-${{ github.ref_name }}-x86_64-unknown-linux-gnu.tar.gz

          # macOS Apple Silicon (M1/M2/M3/M4)
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: axiom
            asset_name: axiom-${{ github.ref_name }}-aarch64-apple-darwin.tar.gz

          # macOS Intel x64
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: axiom
            asset_name: axiom-${{ github.ref_name }}-x86_64-apple-darwin.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p axiom-cli

      - name: Package Binary & Skills (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} staging/
          cp -r skills staging/skills
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.asset_name }}

      - name: Package Binary & Skills (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} staging/
          cp -r skills staging/skills
          tar -czvf ${{ matrix.asset_name }} -C staging .

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}
          generate_release_notes: true

  package-skills:
    name: Package Standalone Agent Skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Package Skills Archive
        run: |
          zip -r axiom-skills-${{ github.ref_name }}.zip skills/

      - name: Upload Standalone Skills to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: axiom-skills-${{ github.ref_name }}.zip
